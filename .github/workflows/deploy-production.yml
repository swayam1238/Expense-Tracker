name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDQX39xphyNhSB6C7EQDrod91XVnCuOwnE' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'expense-tracker-c6459.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'expense-tracker-c6459' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'expense-tracker-c6459.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '608208409866' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:608208409866:web:dd49b6f24b8f4cb67456f3' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-N59ZLD35XW' }}

      - name: Authenticate to Google Cloud (Service Account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase (Hosting & Firestore)
        run: |
          if [ -n "${{ secrets.FIREBASE_TOKEN }}" ]; then
            npx --yes firebase-tools deploy --only hosting,firestore --project "${{ secrets.VITE_FIREBASE_PROJECT_ID || 'expense-tracker-c6459' }}" --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
          else
            npx --yes firebase-tools deploy --only hosting,firestore --project "${{ secrets.VITE_FIREBASE_PROJECT_ID || 'expense-tracker-c6459' }}" --non-interactive
          fi
